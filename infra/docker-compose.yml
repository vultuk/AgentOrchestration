services:
  queue:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  scheduler:
    build:
      context: ..
      dockerfile: infra/Dockerfile.scheduler
    image: agent-orchestrator-scheduler:latest
    environment:
      AO_SCHEDULER_QUEUE_URL: tcp://queue:6379
      AO_SCHEDULER_STORAGE_PATH: /var/lib/agent-orchestrator/scheduler
    volumes:
      - scheduler-state:/var/lib/agent-orchestrator/scheduler
    depends_on:
      queue:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "src.orchestrator.scheduler_health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

  scheduler-consumer:
    image: alpine:3.20
    command: ["sh", "-c", "echo scheduler image is healthy"]
    depends_on:
      scheduler:
        condition: service_healthy

volumes:
  scheduler-state:
